services:
  postgres:
    image: postgres:16-alpine
    container_name: go_learning_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: golearning
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golearning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
