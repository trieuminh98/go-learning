# Config file for [Air](https://github.com/air-verse/air) in TOML format

root = "."
testdata_dir = "testdata"
tmp_dir = "bin"

[build]
# Build target points to composition root cmd/api
cmd = "go build -o ./bin/api ./cmd/api"
# Binary to execute
bin = "./bin/api"
entrypoint = "./bin/api"
# Customize binary execution arguments if needed
args_bin = []
# Watch extensions
include_ext = ["go", "tpl", "tmpl", "html"]
# Exclude non-Go or non-application directories
exclude_dir = ["bin", "docs", "scripts", "migrations", ".git"]
# Exclude test files from triggering rebuilds
exclude_regex = ["_test\\.go$"]
# Exclude unchanged files
exclude_unchanged = false
# Follow symlink
follow_symlink = false
# Debounce delay in milliseconds
delay = 500
# Stop building if any compilation error occurs
stop_on_error = true
# Send Interrupt signal before killing process (prevents socket address in use errors)
send_interrupt = true
kill_delay = 500
# Log build errors
log = "build-errors.log"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp/bin directory on exit
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
